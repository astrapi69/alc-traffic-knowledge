# Set-Manifest: Führerscheinprüfung (Übungsfragen), deutschsprachig.
#
# Zweck (Test-Repo): der fokussierte Ende-zu-Ende-Test der Multiple-Choice-
# Mechanik. Das Set besteht AUSSCHLIESSLICH aus Auswahl-Aufgaben, in drei
# Formen: Einfachauswahl im nativen multiple_choice-Typ (seit Engine 0.8.1,
# Schema v1.6), "Wähle alle zutreffenden" als cloze multiselect, und cloze
# select als echter Lückentext mit Trägersatz. Bis Version 1.0.0 war die
# Einfachauswahl größtenteils als cloze select mit leerem Trägersatz kodiert,
# die Umgehung aus der Zeit vor dem nativen Typ; seit Engine 0.28.0 meldet
# W-CLOZE-NO-CARRIER genau diese Form, und Version 1.1.0 hat sie auf den Typ
# umgestellt, der sie ist. Freitext, Zuordnung oder Wortkacheln gibt es
# bewusst nicht.
#
# Urheberrecht: Der amtliche Fragenkatalog (TÜV/DEKRA) und dessen Bildtafeln
# sind geschützt. Dieses Set übernimmt KEINE amtlichen Prüfungsfragen (weder
# wörtlich noch paraphrasiert) und KEINE amtlichen Bilder. Es sind eigene,
# frei formulierte Übungsfragen über freie Fakten der deutschen StVO
# (Vorfahrt, Geschwindigkeit/Abstand, Promillegrenzen, Parken/Halten).
# "Übungsfragen im Stil einer Führerscheinprüfung, Beispiel Deutschland":
# KEIN Anspruch auf Prüfungsechtheit.
#
# Sachthema-Set (domain: traffic-knowledge): Material und Erklärung sind beide auf
# Deutsch (source_language == target_language); der Set-Ordner trägt einen
# Themennamen. Der Content-Loader liest metadata.lessons für die Dateiliste.
schema_version: '1.3'
name: Führerscheinprüfung (Übungsfragen)
description: >-
  Eigene, frei formulierte Übungsfragen im Stil einer Führerscheinprüfung
  (Beispiel Deutschland), ausschließlich Multiple-Choice. Fünf Lektionen zu
  Vorfahrt und Kreuzungen, Geschwindigkeit und Abstand, Alkohol/Drogen und
  Fahrtüchtigkeit, Parken/Halten sowie Rettungsgasse und Einsatzfahrzeugen.
  Kein amtlicher Fragenkatalog, keine amtlichen Bilder, kein Anspruch auf
  Prüfungsechtheit.
sets:
  - id: fuehrerschein-uebung-from-de
