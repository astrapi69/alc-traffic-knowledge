    description: >-
      Fünf Lektionen mit ausschließlich Auswahl-Übungen (multiple_choice,
      cloze multiselect und Lückentexte mit Auswahl) rund um
      freie Fakten der deutschen StVO: Vorfahrt und Kreuzungen,
      Geschwindigkeit und Abstand, Alkohol/Drogen und Fahrtüchtigkeit,
      Parken/Halten sowie Rettungsgasse und Einsatzfahrzeuge. Eigene
      Formulierungen, keine
      amtlichen Prüfungsfragen, keine Bilder, kein Anspruch auf
      Prüfungsechtheit. Test-Set zum Festnageln der MC-Mechanik.
    tags:
