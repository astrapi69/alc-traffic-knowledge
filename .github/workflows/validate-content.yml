# Content validation (Phase 60 / v1.44.0, D-108; EXP-039).
#
# Runs the validator on every pull request (and on pushes to main)
# so no broken or low-quality lesson set can land. The structural
# fields are validated against the canonical JSON Schema vendored
# under schema/ (a mirror of the pinned learn-content-engine
# release; source-of-truth chain: engine (canonical) -> this
# mirror), the quality minimums are read from
# schema/quality-rules.json, and the content-repo specifics
# (language pair, directory structure, non-Latin scripts) stay in
# the validator. Everything here reads only committed files — the
# validation itself works fully offline.
name: Validate content

on:
  pull_request:
  push:
    branches: [main]

# Coerce Node-runtime actions onto Node 24 as a safety net for any
# action still defaulting to the deprecated Node 20 runtime.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install validator dependencies
        run: pip install "pyyaml>=6,<7" "jsonschema>=4,<5" "pytest>=8,<9" regex "genanki>=0.13,<0.14"
      - name: Prose gate self-test
        # Blocking even while the backlog below is open: a gate that does not
        # fire on known-bad input is broken, backlog or not.
        run: python scripts/check_prose.py --self-test
      - name: Prose findings (non-blocking until the cleanup PR)
        # This repository still carries a backlog the gate reports: em dashes,
        # invisible characters, German written with letter pairs instead of
        # its umlauts. The per-repo cleanup PR works it off and removes
        # continue-on-error in the same commit; from then on a regression
        # fails the PR. Until then the step shows red and the job stays green.
        continue-on-error: true
        run: |
          set +e
          python scripts/check_prose.py > /tmp/prose.txt 2>&1
          status=$?
          set -e
          cat /tmp/prose.txt
          {
            echo "### Prose gate (non-blocking until the cleanup PR)"
            echo
            echo "| file | findings |"
            echo "|---|---|"
            grep -E '^[^ ].*:[0-9]+: ' /tmp/prose.txt | cut -d: -f1 | sort | uniq -c | sort -rn | head -50 \
              | awk '{print "| `" $2 "` | " $1 " |"}' || true
            echo
            tail -1 /tmp/prose.txt
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Validate content tree
        run: python scripts/validate_content.py
      - name: Repo test suite (shape parity #1208, drift-gate units)
        run: python -m pytest tests -q
